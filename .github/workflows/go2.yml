name: Go

on:
  push:
    branches: ["new_workflow"]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'
      
      - name: Build
        run: go build -v ./...

  tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'
  
      - name: Test
        run: go test -v ./...
